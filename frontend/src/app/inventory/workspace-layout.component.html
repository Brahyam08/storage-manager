<div class="workspace">
  <aside class="sidebar">
    <a class="brand" routerLink="/inventario"
      ><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span
      ><span>Storage<span class="brand-light">Manager</span></span></a
    >
    <p class="sidebar-label">TU ESPACIO</p>
    <nav aria-label="Navegación principal">
      <button type="button" [class.active]="!managingHouses()" (click)="showInventory.emit()">
        <span aria-hidden="true">▦</span> Inventario
      </button>
      <button type="button" [class.active]="managingHouses()" (click)="showHouses.emit()">
        <span aria-hidden="true">⌂</span> Casas e invitaciones
      </button>
    </nav>
    <div class="sidebar-note">
      <span class="small-square" aria-hidden="true"></span>
      <p>Cada cosa,<br />en su sitio.</p>
      <small>Un poco de orden cambia el día.</small>
    </div>
    <button class="logout" type="button" (click)="signOut.emit()">
      Cerrar sesión <span aria-hidden="true">↗</span>
    </button>
  </aside>
  <div class="workspace-body">
    <header class="topbar">
      <div class="house-selector">
        <span aria-hidden="true">⌂</span><label class="sr-only" for="house">Casa seleccionada</label
        ><select id="house" [formControl]="houseControl()">
          @if (houseControl().value === null) {
            <option [ngValue]="null" disabled>{{ housePlaceholder() }}</option>
          }
          @for (house of houses(); track house.id) {
            <option [ngValue]="house.id">{{ house.name }}</option>
          }
        </select>
      </div>
      <a class="user-summary" routerLink="/perfil" aria-label="Mi perfil">
        <span class="user-avatar" aria-hidden="true">{{
          auth.user()?.username?.charAt(0)?.toUpperCase()
        }}</span
        ><span>{{ auth.user()?.username }}</span>
      </a>
    </header>
    <main class="main-content">
      <ng-content />
    </main>
  </div>
</div>
