spring:
  application:
    name: storage-manager

  jackson:
    deserialization:
      accept-float-as-int: false

  datasource:
    url: jdbc:postgresql://localhost:5432/storage_manager
    username: brahyam
    password:
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

server:
  port: 8080
  forward-headers-strategy: none

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

security:
  auth-rate-limit:
    login-limit: 20
    login-window-seconds: 60
    registration-limit: 10
    registration-window-seconds: 900
    max-buckets: 10000
  jwt:
    secret: ${JWT_SECRET}
    expiration: 86400000
