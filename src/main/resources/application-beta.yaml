# Use a separate Compose project, database, and JWT secret for external testing.
# Registration is closed; provision test accounts locally before publishing.
security:
  browser-headers:
    enabled: true
  registration:
    enabled: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

spring:
  jpa:
    show-sql: false

server:
  compression:
    enabled: true
    min-response-size: 1024
    # Public shell/assets only; private JSON responses are not compressed.
    mime-types: text/html,text/css,text/javascript,application/javascript
  forward-headers-strategy: none
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
